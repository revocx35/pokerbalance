services:
  pokerbalance:
    image: ghcr.io/revocx35/pokerbalance:latest
    # build: .            # uncomment to build locally instead of pulling
    container_name: pokerbalance
    restart: unless-stopped
    ports:
      - "8443:8443"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
